    <script>
      (function () {
        // 1. Guard against Vite HMR WebSocket failures in proxy / preview environments
        if (typeof window !== 'undefined' && typeof window.WebSocket !== 'undefined') {
          var RealWebSocket = window.WebSocket;

          function ViteMockWebSocket(url, protocols) {
            var target = new EventTarget();
            var self = this;
            self.url = url;
            self.protocols = protocols;
            self.readyState = 1; // WebSocket.OPEN
            self.CONNECTING = 0;
            self.OPEN = 1;
            self.CLOSING = 2;
            self.CLOSED = 3;
            self.bufferedAmount = 0;
            self.extensions = '';
            self.binaryType = 'blob';

            self.addEventListener = target.addEventListener.bind(target);
            self.removeEventListener = target.removeEventListener.bind(target);
            self.dispatchEvent = target.dispatchEvent.bind(target);

            self.send = function () {};
            self.close = function (code, reason) {
              self.readyState = 3;
              setTimeout(function () {
                if (typeof self.onclose === 'function') {
                  self.onclose(new CloseEvent('close', { code: code || 1000, reason: reason || '' }));
                }
                self.dispatchEvent(new CloseEvent('close', { code: code || 1000, reason: reason || '' }));
              }, 0);
            };

            setTimeout(function () {
              if (self.readyState === 1) {
                if (typeof self.onopen === 'function') {
                  self.onopen(new Event('open'));
                }
                self.dispatchEvent(new Event('open'));
              }
            }, 0);
          }

          ViteMockWebSocket.prototype = RealWebSocket.prototype;
          ViteMockWebSocket.CONNECTING = 0;
          ViteMockWebSocket.OPEN = 1;
          ViteMockWebSocket.CLOSING = 2;
          ViteMockWebSocket.CLOSED = 3;

          window.WebSocket = function (url, protocols) {
            var isViteHmr =
              protocols === 'vite-hmr' ||
              protocols === 'vite-ping' ||
              (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1));
            if (isViteHmr) {
              return new ViteMockWebSocket(url, protocols);
            }
            return new RealWebSocket(url, protocols);
          };

          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
          window.WebSocket.prototype = RealWebSocket.prototype;
        }

        // 2. Global uncaught error filter for any remaining Vite client messages
        var isViteWsError = function (e) {
          if (!e) return false;
          var msg = String(e.message || (e.reason && e.reason.message) || e);
          var stack = String(e.stack || (e.reason && e.reason.stack) || '');
          return (
            msg.indexOf("reading 'send'") !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            stack.indexOf('@vite/client') !== -1
          );
        };

        window.addEventListener(
          'error',
          function (e) {
            if (isViteWsError(e) || isViteWsError(e.error)) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (e) {
            if (isViteWsError(e) || isViteWsError(e.reason)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );

        if ('serviceWorker' in navigator && (location.hostname === 'localhost' || location.hostname.includes('run.app'))) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister().catch(function () {});
            }
          }).catch(function () {});
        }
      })();
    </script>
