<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#000000" />
  <g transform="translate(256, 256)">
    <!-- Outer Meridian Ring -->
    <circle cx="0" cy="0" r="190" fill="none" stroke="#D4A373" stroke-width="8" opacity="0.9" />
    <circle cx="0" cy="0" r="172" fill="none" stroke="#D4A373" stroke-width="2" stroke-dasharray="6 8" opacity="0.6" />
    <!-- Ecliptic & Equatorial Rings -->
    <ellipse cx="0" cy="0" rx="190" ry="68" fill="none" stroke="#D4A373" stroke-width="5" transform="rotate(-23.5)" opacity="0.85" />
    <ellipse cx="0" cy="0" rx="190" ry="68" fill="none" stroke="#4CC9F0" stroke-width="3" transform="rotate(23.5)" opacity="0.6" />
    <ellipse cx="0" cy="0" rx="75" ry="190" fill="none" stroke="#D4A373" stroke-width="4" opacity="0.7" />
    <!-- Polar Axis -->
    <line x1="0" y1="-215" x2="0" y2="215" stroke="#D4A373" stroke-width="4" opacity="0.8" />
    <!-- Accretion / Singularity Core -->
    <circle cx="0" cy="0" r="46" fill="#000000" stroke="#FF5400" stroke-width="6" />
    <circle cx="0" cy="0" r="32" fill="#000000" stroke="#D4A373" stroke-width="3" />
    <circle cx="0" cy="0" r="8" fill="#D4A373" />
    <!-- Orbital Nodes -->
    <circle cx="-154" cy="-64" r="10" fill="#4CC9F0" />
    <circle cx="145" cy="59" r="12" fill="#FF5400" />
  </g>
</svg>
